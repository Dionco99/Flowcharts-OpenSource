[project]
name = "flowchart-multi-instrument"
version = "0.1.0"
description = "Multi-symbol Flowchart bar data: a symbol registry, two charts on one replay clock, and user-supplied tapes."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.urls]
Homepage = "https://github.com/Dionco99/Flowcharts-OpenSource"
Repository = "https://github.com/Dionco99/Flowcharts-OpenSource"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
