[project]
name = "flowchart-bars"
version = "0.1.0"
description = "Symbol spec, 1-minute tape, and cursor-gated bars for Flowchart replay."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Dionco99" }]
keywords = ["ohlc", "forex", "replay"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowchart_bars = ["py.typed"]
