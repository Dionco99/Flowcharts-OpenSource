name: brokers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brokers:
    name: broker adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and typecheck
        working-directory: packages/brokers
        run: npm ci && npm test && npm run typecheck
