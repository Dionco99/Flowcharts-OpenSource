name: Replay

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  replay-desk:
    name: Replay desk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test and typecheck
        run: npm test && npm run typecheck
