name: bars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bars:
    name: bars tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: PYTHONPATH=packages/bars/src python3 -m unittest discover -s packages/bars/tests -v
