name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license:
    name: Apache-2.0 license check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Apache-2.0
        run: python3 scripts/check_apache_license.py

  multi-instrument:
    name: multi-instrument tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: PYTHONPATH=packages/multi-instrument/src python3 -m unittest discover -s packages/multi-instrument/tests -v

  accounts:
    name: accounts package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/accounts/package-lock.json
      - name: Test and typecheck
        working-directory: packages/accounts
        run: npm ci && npm test && npm run typecheck

  billing:
    name: Billing package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/billing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/billing/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  web:
    name: Web shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test web shell
        run: node --test apps/web/test/server.test.mjs

  edge:
    name: edge package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/edge/package-lock.json
      - name: Test and typecheck
        working-directory: packages/edge
        run: npm ci && npm test && npm run typecheck
