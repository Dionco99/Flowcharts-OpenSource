name: chart-tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chart-tools:
    name: chart-tools package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test and typecheck
        run: npm test -w @flowchart/chart-tools && npm run typecheck -w @flowchart/chart-tools
