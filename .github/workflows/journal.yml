name: Journal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  journal:
    name: journal package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/journal/package-lock.json
      - name: Test
        working-directory: packages/journal
        run: npm ci && npm test
