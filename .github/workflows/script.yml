name: Script

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  script:
    name: Flowchart Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/script/package-lock.json
      - name: Test and typecheck
        working-directory: packages/script
        run: npm ci && npm test && npm run typecheck
